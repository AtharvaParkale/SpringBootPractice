spring.application.name=SpringSecurities

#spring.security.user.name=admin
#spring.security.user.password=admin123

spring.datasource.url= jdbc:mysql://localhost:3306/security_app
spring.datasource.username = root
spring.datasource.password=$Oracle7707
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Logging
logging.level.root=INFO
logging.level.com.springboot.SpringSecurities=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/spring-securities.log
logging.file.path=logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7